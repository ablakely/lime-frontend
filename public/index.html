<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIME Frontend</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">LIME Manuals</a>
      </div>
    </nav>

    <main class="container py-4">
      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h1 class="h4 mb-3">Find a Manual</h1>
          <form id="quick-nav-form" class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
              <label for="quick-make" class="form-label">Make</label>
              <input id="quick-make" class="form-control" list="make-options" autocomplete="off" />
              <datalist id="make-options"></datalist>
            </div>
            <div class="col-12 col-md-3">
              <label for="quick-year" class="form-label">Year</label>
              <input id="quick-year" class="form-control" list="year-options" autocomplete="off" />
              <datalist id="year-options"></datalist>
            </div>
            <div class="col-12 col-md-4">
              <label for="quick-model" class="form-label">Model/Engine</label>
              <input id="quick-model" class="form-control" list="model-options" autocomplete="off" />
              <datalist id="model-options"></datalist>
            </div>
            <div class="col-12 col-md-1 d-grid">
              <button type="submit" class="btn btn-primary">Go</button>
            </div>
          </form>
        </div>
      </section>

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-3" id="breadcrumbs"></ol>
      </nav>

      <div id="message" class="alert d-none" role="alert"></div>
      <div id="loading" class="text-center py-5 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 mb-0">Loading…</p>
      </div>
      <div id="content"></div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
